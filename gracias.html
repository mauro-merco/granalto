    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --color-bg: #f7f7f4;
        --color-surface: #ffffff;
        --color-brand: #d71920;
        --color-brand-dark: #a90f16;
        --color-text: #171717;
        --color-text-muted: #6b6b68;
        --color-border: #d9d9d4;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --font-body: "Montserrat", Arial, sans-serif;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-body);
        background: var(--color-bg);
        color: var(--color-text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      a {
        text-decoration: none;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem clamp(1.25rem, 4vw, 2rem);
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface);
      }

      .topbar img {
        height: 2.5rem;
        width: auto;
        display: block;
      }

      .topbar a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--color-text);
        transition: color 0.3s;
      }

      .topbar a:hover {
        color: var(--color-brand);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(3rem, 8vw, 6rem) clamp(1.25rem, 4vw, 2rem);
      }

      .gracias-card {
        max-width: 640px;
        width: 100%;
        text-align: center;
      }

      .gracias-check {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        margin-bottom: 1.75rem;
        border-radius: 50%;
        background: var(--color-brand);
        color: #fff;
        font-size: 2.1rem;
        font-weight: 700;
        line-height: 1;
        box-shadow: 0 18px 40px -12px rgba(215, 25, 32, 0.5);
        animation: pop 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes pop {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        70% {
          transform: scale(1.12);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--color-brand);
      }

      .eyebrow::before {
        content: "";
        width: 2rem;
        height: 1px;
        background: var(--color-brand);
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: clamp(2.4rem, 4.5vw, 4rem);
        line-height: 1.05;
        margin-top: 1rem;
      }

      h1 .serif-i {
        font-style: italic;
      }

      .lead {
        margin-top: 1rem;
        font-size: clamp(1rem, 1.5vw, 1.15rem);
        color: var(--color-text-muted);
      }

      .actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 2.25rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.9rem 1.75rem;
        border-radius: 4px;
        font-family: var(--font-body);
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out),
          background 0.3s, color 0.3s, border-color 0.3s;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: var(--color-brand);
        color: #fff;
        box-shadow: 0 12px 30px -10px rgba(215, 25, 32, 0.45);
      }

      .btn-primary:hover {
        background: var(--color-brand-dark);
      }

      .btn-secondary {
        background: transparent;
        color: var(--color-text);
        border: 1px solid var(--color-border);
      }

      .btn-secondary:hover {
        border-color: var(--color-text);
      }

      .btn-whatsapp {
        background: #25d366;
        color: #fff;
        box-shadow: 0 12px 30px -10px rgba(37, 211, 102, 0.45);
      }

      .btn-whatsapp:hover {
        background: #1eaa52;
      }

      .arrow {
        display: inline-block;
        transform: rotate(180deg);
      }

      @media (max-width: 640px) {
        .actions .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>

    <header class="topbar">
      <img src="./img/logo-white.png" alt="Gran Alto" />
      <a href="./">Acceder al proyecto</a>
    </header>

    <main>
      <div class="gracias-card">
        <span class="gracias-check" aria-hidden="true">✓</span>
        <p class="eyebrow">Contacto</p>
        <h1>¡Gracias por <span class="serif-i">escribirnos!</span></h1>
        <p class="lead">
          Recibimos tu solicitud correctamente. Un asesor de
          <strong>Gran Alto</strong> se comunicará con vos a la brevedad para brindarte
          disponibilidad, condiciones comerciales y asesoramiento.
        </p>
        <div class="actions">
          <a class="btn btn-primary" href="./">Volver al proyecto</a>
          <a class="btn btn-secondary" href="./#/contacto">
            <span class="arrow">→</span> Volver a contacto
          </a>
          <a
            class="btn btn-whatsapp"
            href="https://wa.me/595993583943?text=Hola%2C%20quiero%20recibir%20informaci%C3%B3n%20sobre%20Gran%20Alto%20Las%20Mercedes."
            target="_blank"
            rel="noreferrer"
          >
            Quiero chatear por WhatsApp
          </a>
        </div>
      </div>
    </main>
